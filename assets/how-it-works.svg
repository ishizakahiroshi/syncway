<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrL" markerWidth="12" markerHeight="12" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="420" fill="#f8fafc"/>

  <!-- Local box -->
  <rect x="40" y="120" width="240" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Local (Windows)</text>
  <text x="160" y="176" text-anchor="middle" font-size="13" fill="#64748b">PowerShell / bash</text>
  <rect x="70" y="196" width="180" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="225" text-anchor="middle" font-size="13" fill="#1e3a8a">C:\projects\myproj</text>
  <text x="160" y="250" text-anchor="middle" font-size="12" fill="#475569">WSL rsync / rsync.exe</text>

  <!-- Remote server box -->
  <rect x="580" y="120" width="240" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Remote server</text>
  <text x="700" y="176" text-anchor="middle" font-size="13" fill="#64748b">rsync over ssh</text>
  <rect x="610" y="196" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="700" y="222" text-anchor="middle" font-size="13" fill="#166534">/home/&lt;user&gt;/myproj</text>
  <text x="700" y="245" text-anchor="middle" font-size="11" fill="#475569">or Docker container FS</text>
  <text x="700" y="262" text-anchor="middle" font-size="11" fill="#475569">(docker exec rsync)</text>

  <!-- Upload arrow (local -> remote) -->
  <line x1="285" y1="180" x2="575" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="430" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#16a34a">Upload  sync-to-dev-server</text>

  <!-- Download arrow (remote -> local) -->
  <line x1="575" y1="240" x2="285" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrL)"/>
  <text x="430" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">Download  sync-from-dev-server</text>

  <!-- Title -->
  <text x="430" y="52" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a">Syncway</text>
  <text x="430" y="80" text-anchor="middle" font-size="14" fill="#475569">Bidirectional rsync over ssh — no secrets baked into the scripts</text>

  <!-- Safety footer -->
  <rect x="160" y="330" width="540" height="56" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="430" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Deletions are OFF by default</text>
  <text x="430" y="375" text-anchor="middle" font-size="12" fill="#9a3412">--delete previews only; --confirm-delete is required to actually remove files</text>
</svg>
