<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0.04" x2="0.92" y2="0.98">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b6a8"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b5b48" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- bright, clear app frame -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>

  <!-- circular bidirectional sync (white glyph, soft depth) -->
  <g filter="url(#soft)" fill="#ffffff" stroke="#ffffff" stroke-width="46" stroke-linecap="round">
    <!-- top arc (clockwise) -->
    <path fill="none" d="M135.7 212.2 A128 128 0 0 1 376.3 212.2"/>
    <polygon stroke="none" points="396.1,266.7 334.6,214.6 409.8,187.2"/>
    <!-- bottom arc (clockwise) -->
    <path fill="none" d="M376.3 299.8 A128 128 0 0 1 135.7 299.8"/>
    <polygon stroke="none" points="115.9,245.3 177.4,297.4 102.2,324.8"/>
  </g>
</svg>
